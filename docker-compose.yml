name: even-stack
services:
  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: even_db
      DB_USER: even_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PORT: 3000
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, monitoring, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: even_db
      POSTGRES_USER: even_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U even_app -d even_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports: ["127.0.0.1:5050:80"]
    depends_on: [db]
    networks: [backend, frontend]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    ports: ["8080:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    networks: [frontend]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=16m,uid=101,gid=101
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Set GRAFANA_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["grafanadata:/var/lib/grafana", "./grafana/provisioning:/etc/grafana/provisioning:ro", "./grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["127.0.0.1:3001:3000"]
    networks: [monitoring]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes: ["./loki/config.yml:/etc/loki/config.yml:ro", "lokidata:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    networks: [monitoring]
    restart: unless-stopped
  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: ["./promtail/config.yml:/etc/promtail/config.yml:ro", "/var/lib/docker/containers:/var/lib/docker/containers:ro"]
    networks: [monitoring]
    restart: unless-stopped
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://even_app:${DB_PASSWORD}@db:5432/even_db?sslmode=disable"
    networks: [backend, monitoring]
    depends_on: [db]
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring]
    restart: unless-stopped
networks:
  frontend: {}
  backend:
    internal: true
  monitoring: {}
volumes:
  pgdata: {}
  promdata: {}
  grafanadata: {}
  lokidata: {}
